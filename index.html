<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Relatório de Impacto ADEC 2025 — Flipbook Interativo HD</title>
  <meta name="description" content="Relatório de Impacto ADEC 2025 em formato de flipbook digital interativo com efeito 3D em altíssima resolução." />
  <meta property="og:title" content="Relatório de Impacto ADEC 2025 — Flipbook HD" />
  <meta property="og:description" content="Acesse o Relatório de Impacto ADEC 2025 em alta definição." />
  <meta property="og:image" content="/pages/page-01.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #070913;
      --surface: #0f1322;
      --accent: #6366f1;
      --accent-grad: linear-gradient(135deg, #6366f1, #8b5cf6);
      --glass: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      user-select: none;
      -webkit-user-select: none;
    }

    /* ─── Header ─── */
    header {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: rgba(7, 9, 19, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--accent-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }
    .brand-logo svg {
      width: 16px;
      height: 16px;
      color: #fff;
    }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.2px;
    }
    .header-sub {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      background: var(--accent-grad);
      color: #ffffff;
      letter-spacing: 0.8px;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* ─── Stage / Flipbook Viewer ─── */
    #stage {
      flex: 1 1 0%;
      min-height: 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 10px 16px;
      background: radial-gradient(circle at center, rgba(30, 27, 75, 0.35) 0%, rgba(7, 9, 19, 0.98) 75%);
    }

    #stage-inner {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform-origin: center center;
      max-width: 100%;
      max-height: 100%;
    }

    #flipbook-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: 100%;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    #flipbook {
      background: transparent !important;
      box-shadow: none !important;
      border: none !important;
    }

    /* ─── Realistic 3D Stacked Pages & Natural Spine ─── */
    .page {
      background-color: #ffffff;
      overflow: hidden;
      position: relative;
      border-radius: 1px;
    }

    /* Cover Page (closed book): stacked page edges on right side (para fora da página) */
    .page.page-cover {
      border-radius: 2px 4px 4px 2px;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.08),
        /* Layered stacked paper pages on right edge */
        1px 0px 0 #edebe6,
        2px 1px 0 #dfdbd0,
        3px 1px 0 #edebe6,
        4px 2px 0 #d3cebf,
        5px 2px 0 #edebe6,
        6px 3px 0 #c7c1b0,
        7px 3px 0 #edebe6,
        8px 4px 0 #b8b19e,
        /* Deep ambient and directional drop shadows */
        12px 18px 40px rgba(0, 0, 0, 0.6),
        25px 35px 70px rgba(0, 0, 0, 0.45);
    }

    /* Cover Spine Shadow on left edge: ultra-soft, subtle, natural curve without dark band */
    .page.page-cover .page-content::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 14px;
      background: linear-gradient(to right,
        rgba(0, 0, 0, 0.07) 0%,
        rgba(0, 0, 0, 0.02) 50%,
        transparent 100%
      );
      z-index: 10;
      pointer-events: none;
    }

    /* Open Left Page: outer shadow on left (para fora), soft gutter crease on right */
    .page.--left {
      border-radius: 4px 1px 1px 4px;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.06),
        -10px 15px 35px rgba(0, 0, 0, 0.5);
    }
    .page.--left .page-content::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 24px;
      background: linear-gradient(to left, 
        rgba(0, 0, 0, 0.14) 0%,
        rgba(0, 0, 0, 0.03) 60%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 10;
    }

    /* Open Right Page: stacked pages on right side (para fora da página), soft gutter crease on left */
    .page.--right {
      border-radius: 1px 4px 4px 1px;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.06),
        /* Layered paper block edges on the outer right */
        1px 0px 0 #edebe6,
        2px 1px 0 #dfdbd0,
        3px 1px 0 #edebe6,
        4px 2px 0 #d3cebf,
        5px 2px 0 #edebe6,
        6px 3px 0 #c7c1b0,
        10px 15px 35px rgba(0, 0, 0, 0.5);
    }
    .page.--right .page-content::after {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 24px;
      background: linear-gradient(to right, 
        rgba(0, 0, 0, 0.14) 0%,
        rgba(0, 0, 0, 0.03) 60%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 10;
    }

    .page-content {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    .page-content img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    /* ─── Navigation Arrows ─── */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(15, 19, 34, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: rgba(255, 255, 255, 0.9);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .nav-arrow:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      transform: translateY(-50%) scale(1.1);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.5);
    }
    .nav-arrow:active { transform: translateY(-50%) scale(0.95); }
    .nav-arrow.prev { left: 24px; }
    .nav-arrow.next { right: 24px; }
    .nav-arrow svg { width: 24px; height: 24px; }

    /* ─── Bottom Controls Bar ─── */
    #controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 24px;
      background: rgba(7, 9, 19, 0.92);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      flex-shrink: 0;
      z-index: 100;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      height: 38px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--glass);
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    .ctrl-btn:active { transform: scale(0.96); }
    .ctrl-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    .ctrl-btn.primary {
      background: var(--accent-grad);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }
    .ctrl-btn.primary:hover {
      filter: brightness(1.12);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    #page-info {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      min-width: 90px;
      text-align: center;
      letter-spacing: 0.2px;
    }

    #progress-wrap {
      width: 130px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
    }
    #progress-bar {
      height: 100%;
      background: var(--accent-grad);
      border-radius: 3px;
      width: 4%;
      transition: width 0.25s ease;
    }

    /* ─── Zoom Overlay Controls ─── */
    .zoom-badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 45px;
      text-align: center;
    }

    /* ─── Loading Overlay ─── */
    #loading {
      position: fixed;
      inset: 0;
      background: #070913;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 16px;
      transition: opacity 0.4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(99, 102, 241, 0.15);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading h3 { font-size: 17px; font-weight: 600; color: #fff; }
    #loading p { font-size: 13px; color: var(--text-muted); }

    /* Responsive */
    @media (max-width: 768px) {
      header { padding: 8px 14px; }
      .header-title { font-size: 13px; }
      .nav-arrow { width: 42px; height: 42px; }
      .nav-arrow.prev { left: 8px; }
      .nav-arrow.next { right: 8px; }
      #controls { padding: 8px 12px; gap: 8px; }
      .btn-text { display: none; }
      #progress-wrap { width: 70px; }
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <h3>Carregando Relatório ADEC 2025</h3>
    <p>Renderizando páginas em Ultra HD 300 DPI...</p>
  </div>

  <!-- Header -->
  <header>
    <div class="header-left">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div>
        <div class="header-title">Relatório de Impacto ADEC 2025</div>
        <div class="header-sub">
          <span>Associação de Desenvolvimento Esportivo e Cultural</span>
        </div>
      </div>
    </div>
    <div class="header-badge">ADEC</div>
  </header>

  <!-- Stage -->
  <main id="stage">
    <button class="nav-arrow prev" id="btn-prev" aria-label="Página anterior" title="Página anterior (←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>

    <div id="stage-inner">
      <div id="flipbook-wrapper">
        <div id="flipbook">
          <!-- Dynamic high-res HTML pages with subpixel GPU rendering -->
        </div>
      </div>
    </div>

    <button class="nav-arrow next" id="btn-next" aria-label="Próxima página" title="Próxima página (→)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </main>

  <!-- Controls -->
  <footer id="controls">
    <div class="ctrl-group">
      <button class="ctrl-btn" id="btn-first" title="Primeira página">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
        <span class="btn-text">Início</span>
      </button>

      <div id="progress-wrap" title="Progresso de leitura">
        <div id="progress-bar"></div>
      </div>

      <span id="page-info">Pág. 1 / 25</span>

      <button class="ctrl-btn" id="btn-last" title="Última página">
        <span class="btn-text">Fim</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
      </button>
    </div>

    <div class="ctrl-group">
      <!-- Zoom Controls -->
      <button class="ctrl-btn" id="btn-zoom-out" title="Reduzir zoom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
      <span class="zoom-badge" id="zoom-val">100%</span>
      <button class="ctrl-btn" id="btn-zoom-in" title="Aumentar zoom (Nitidez máxima)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>

      <!-- Sound Control -->
      <button class="ctrl-btn" id="btn-sound" title="Som de página virando (M)">
        <svg id="sound-icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <svg id="sound-icon-off" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
        </svg>

      <button class="ctrl-btn primary" id="btn-fullscreen" title="Tela cheia (F)">

        <span class="btn-text" id="fs-text">Tela Cheia</span>
      </button>
    </div>
  </footer>

  <!-- StPageFlip script -->
  <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script>
    const TOTAL_PAGES = 25;
    const flipbookEl = document.getElementById('flipbook');
    const stageEl = document.getElementById('stage');
    const stageInner = document.getElementById('stage-inner');

    // Build DOM pages
    for (let i = 1; i <= TOTAL_PAGES; i++) {
      const n = String(i).padStart(2, '0');
      const pageDiv = document.createElement('div');
      pageDiv.className = 'page' + (i === 1 ? ' page-cover' : '');
      if (i === 1 || i === TOTAL_PAGES) {
        pageDiv.setAttribute('data-density', 'hard');
      }
      
      const content = document.createElement('div');
      content.className = 'page-content';

      const img = document.createElement('img');
      img.src = `/pages/page-${n}.png`;
      img.alt = `Página ${i}`;
      img.loading = i <= 6 ? 'eager' : 'lazy';
      img.decoding = 'async';

      content.appendChild(img);
      pageDiv.appendChild(content);
      flipbookEl.appendChild(pageDiv);
    }

    function calcSize() {
      const isMobile = window.innerWidth <= 768;
      const stageRect = stageEl.getBoundingClientRect();
      const availableH = (stageRect.height > 100 ? stageRect.height : (window.innerHeight - 108)) - (isMobile ? 12 : 28);
      const availableW = (stageRect.width > 100 ? stageRect.width : window.innerWidth) - (isMobile ? 16 : 140);
      const ratio = 595.276 / 841.89; // Exact A4 proportions (0.707)

      if (isMobile) {
        let h = availableH;
        let w = h * ratio;
        if (w > availableW) {
          w = availableW;
          h = w / ratio;
        }
        return { w: Math.floor(w), h: Math.floor(h), mode: 'portrait' };
      } else {
        // Double page spread on desktop
        let h = availableH;
        let totalW = h * ratio * 2;
        if (totalW > availableW) {
          totalW = availableW;
          h = (totalW / 2) / ratio;
        }
        if (h > availableH) {
          h = availableH;
          totalW = h * ratio * 2;
        }
        const singleW = Math.floor(totalW / 2);
        return { w: singleW, h: Math.floor(h), mode: 'landscape' };
      }
    }

    let pageFlip = null;
    let currentZoom = 1.0;

    function initFlipbook() {
      const { w, h, mode } = calcSize();

      pageFlip = new St.PageFlip(flipbookEl, {
        width: w,
        height: h,
        size: 'fixed',
        minWidth: 100,
        maxWidth: 3000,
        minHeight: 100,
        maxHeight: 3000,
        showCover: true,
        mobileScrollSupport: false,
        drawShadow: true,
        flippingTime: 550,
        startPage: 0,
        usePortrait: mode === 'portrait',
        autoSize: false,
        maxShadowOpacity: 0.5,
        clickEventForward: true,
        useMouseEvents: true,
        swipeDistance: 20
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));

      pageFlip.on('flip', (e) => {
        playPageFlipSound();
        updateUI(e.data);
      });
      pageFlip.on('changeState', (e) => {
        if (e.data === 'flipping') {
          playPageFlipSound();
        }
        updateUI(pageFlip.getCurrentPageIndex());
      });

      pageFlip.on('init', () => {
        document.getElementById('loading').classList.add('hidden');
        updateUI(0);
      });
    }

      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        soundIconOn.style.display = 'block';
        soundIconOff.style.display = 'none';
        btnSound.title = 'Som de página virando (M) — Ativado';
        playPageFlipSound();
      } else {
        soundIconOn.style.display = 'none';
        soundIconOff.style.display = 'block';
        btnSound.title = 'Som desativado (M)';
      }
    }

    if (btnSound) {
      btnSound.addEventListener('click', () => {
        getAudioContext();
        toggleSound();
      });
    }

    // Unlock audio context on initial interaction
    ['click', 'keydown', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, () => {
        if (!audioCtx) getAudioContext();
      }, { once: true });
    });

    const flipbookWrapper = document.getElementById('flipbook-wrapper');

    function updateBookPosition(pageIdx) {
      if (!pageFlip) return;
      const isMobile = window.innerWidth <= 768;
      const total = pageFlip.getPageCount();
      const { w } = calcSize();

      if (isMobile) {
        flipbookWrapper.style.transform = 'translateX(0px)';
        return;
      }

      if (pageIdx === 0) {
        // Cover page centered: shift container left by half a page width
        flipbookWrapper.style.transform = `translateX(-${w / 2}px)`;
      } else if (pageIdx === total - 1) {
        // Back cover page centered: shift container right by half a page width
        flipbookWrapper.style.transform = `translateX(${w / 2}px)`;
      } else {
        // 2-page open spread centered
        flipbookWrapper.style.transform = 'translateX(0px)';
      }
    }

    function updateUI(pageIdx) {
      if (!pageFlip) return;
      const total = pageFlip.getPageCount();
      const isMobile = window.innerWidth <= 768;
      
      let label = '';
      if (isMobile || pageIdx === 0 || pageIdx === total - 1) {
        label = `Pág. ${pageIdx + 1} / ${total}`;
      } else {
        const left = pageIdx;
        const right = pageIdx + 1;
        label = `Pág. ${left}-${right} / ${total}`;
      }

      document.getElementById('page-info').textContent = label;
      const pct = (pageIdx / Math.max(total - 1, 1)) * 100;
      document.getElementById('progress-bar').style.width = Math.max(pct, 4) + '%';
      updateBookPosition(pageIdx);
    }

    // ── Navigation Buttons ──
    document.getElementById('btn-prev').addEventListener('click', () => pageFlip && pageFlip.flipPrev());
    document.getElementById('btn-next').addEventListener('click', () => pageFlip && pageFlip.flipNext());
    document.getElementById('btn-first').addEventListener('click', () => { if (pageFlip) { playPageFlipSound('lg'); pageFlip.flip(0); } });
    document.getElementById('btn-last').addEventListener('click', () => { if (pageFlip) { playPageFlipSound('lg'); pageFlip.flip(pageFlip.getPageCount() - 1); } });

    // ── Zoom Controls ──
    const zoomVal = document.getElementById('zoom-val');

    function applyZoom(delta) {
      if (delta === 0) currentZoom = 1.0;
      else currentZoom = Math.min(Math.max(currentZoom + delta, 0.8), 2.2);
      
      stageInner.style.transform = `scale(${currentZoom})`;
      zoomVal.textContent = Math.round(currentZoom * 100) + '%';
    }

    document.getElementById('btn-zoom-in').addEventListener('click', () => applyZoom(0.2));
    document.getElementById('btn-zoom-out').addEventListener('click', () => applyZoom(-0.2));

    // ── Fullscreen ──
    function toggleFullscreen() {
      const fsText = document.getElementById('fs-text');
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        if (fsText) fsText.textContent = 'Sair';
      } else {
        document.exitFullscreen().catch(() => {});
        if (fsText) fsText.textContent = 'Tela Cheia';
      }
    }
    document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);

    document.addEventListener('fullscreenchange', () => {
      const fsText = document.getElementById('fs-text');
      if (fsText) fsText.textContent = document.fullscreenElement ? 'Sair' : 'Tela Cheia';
    });

    // ── Keyboard ──
    document.addEventListener('keydown', (e) => {
      if (!pageFlip) return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') pageFlip.flipNext();
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   pageFlip.flipPrev();
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      if (e.key === 'm' || e.key === 'M') toggleSound();
      if (e.key === 'Home') pageFlip.flip(0);
      if (e.key === 'End')  pageFlip.flip(pageFlip.getPageCount() - 1);
      if (e.key === '+' || e.key === '=') applyZoom(0.2);
      if (e.key === '-') applyZoom(-0.2);
      if (e.key === '0') applyZoom(0);
    });

    // ── Resize ──
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (pageFlip) {
          const { w, h, mode } = calcSize();
          pageFlip.update({
            width: w,
            height: h,
            usePortrait: mode === 'portrait'
          });
          updateBookPosition(pageFlip.getCurrentPageIndex());
        }
      }, 150);
    });

    window.addEventListener('load', initFlipbook);
  </script>
</body>
</html>
